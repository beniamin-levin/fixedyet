# http-level part of the FixedYet setup (a map and a rate-limit zone cannot live in a server
# block). deploy.sh copies this file to /etc/nginx/conf.d/fixedyet-limits.conf, which the stock
# nginx.conf includes inside http { }. It does nothing until fixedyet.nginx.conf is included.

# POST requests only are rate limited per client address (an empty key is not counted).
map $request_method $fixedyet_post_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $fixedyet_post_key zone=fixedyet_post:1m rate=6r/m;
