# The fixedyet.benlevin.fyi server block. Set it up ONCE by hand on the nginx host; deploy.sh never
# writes a server block:
#
#   sudo cp deploy/fixedyet-server.nginx.conf /etc/nginx/sites-available/fixedyet.benlevin.fyi.conf
#   sudo ln -s ../sites-available/fixedyet.benlevin.fyi.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fixedyet.benlevin.fyi --redirect
#
# DNS first: an A record "fixedyet" for benlevin.fyi pointing at this host. certbot then adds the
# HTTPS listener, the certificate paths and the http -> https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name fixedyet.benlevin.fyi;

    include snippets/fixedyet-site.conf;
}
