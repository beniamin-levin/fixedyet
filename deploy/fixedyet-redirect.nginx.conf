# The old address, https://benlevin.fyi/fixedyet/, now redirects to https://fixedyet.benlevin.fyi/
#
# deploy.sh copies this file to /etc/nginx/snippets/fixedyet.conf, the snippet the benlevin.fyi
# server block already includes, so links shared before the move keep working. 308 keeps the
# method, so a POST from a page opened before the move still reaches the API.

location ~ ^/fixedyet(/.*)?$ {
    return 308 https://fixedyet.benlevin.fyi$1$is_args$args;
}
