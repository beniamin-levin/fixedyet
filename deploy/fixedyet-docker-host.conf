# systemd drop-in for a VM that runs the Docker sandbox (installed by deploy.sh when
# DEPLOY_DOCKER_HOST=1, as /etc/systemd/system/fixedyet.service.d/docker-host.conf).
#
# nginx on another VM proxies fixedyet.benlevin.fyi here, so the app listens on all interfaces.
# Allow the port from that VM only: an iptables ACCEPT for its private IP, and a matching rule in
# the cloud security list. Set FIXEDYET_SANDBOX=docker in /etc/fixedyet.env.
[Service]
SupplementaryGroups=docker
Environment=DOCKER_CONFIG=/var/lib/fixedyet/docker-config
# The runs directory here is /var/lib/fixedyet/runs, and so is the spend ledger (about $0.45 so
# far): keep counting in the same file.
Environment=FIXEDYET_LEDGER_PATH=/var/lib/fixedyet/runs/spend-ledger.json
# uvicorn reads X-Forwarded-Proto and X-Forwarded-For only from the addresses in
# FORWARDED_ALLOW_IPS (default 127.0.0.1). nginx is on another VM, so without this every request
# looked like plain http, and a redirect (/reports/ to /reports) sent the browser to http://,
# which nginx then sent back to https. This is the nginx VM's private IP. If the proxy moves,
# change it here or set FORWARDED_ALLOW_IPS in /etc/fixedyet.env (a line there wins).
Environment=FORWARDED_ALLOW_IPS=10.0.0.44
ExecStart=
ExecStart=/opt/fixedyet/.venv/bin/fixedyet serve --host 0.0.0.0 --port 8090
# The app stays small; containers run under dockerd, outside this limit.
MemoryMax=450M
ReadWritePaths=/var/lib/fixedyet
