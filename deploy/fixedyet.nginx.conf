# FixedYet at https://benlevin.fyi/fixedyet/  ->  the FastAPI app on 127.0.0.1:8090
#
# This file is a location snippet, not a server block: benlevin.fyi already has its server (and
# its HTTPS certificate), and FixedYet lives under a path of it. deploy.sh copies this file to
# /etc/nginx/snippets/fixedyet.conf; add ONE line inside the existing benlevin.fyi server { }:
#
#     include snippets/fixedyet.conf;
#
# The zone used below is declared in fixedyet-limits.nginx.conf (http level, installed as
# /etc/nginx/conf.d/fixedyet-limits.conf).
#
# The trailing slash on proxy_pass strips the /fixedyet/ prefix, so the app sees /api/status.
# The app runs with --root-path /fixedyet so redirects and URLs in its JSON carry the prefix back.

location = /fixedyet {
    return 301 /fixedyet/;
}

# ^~ keeps any regex location of the existing server (for example a static-files rule) from
# taking requests under /fixedyet/ away from this block.
location ^~ /fixedyet/ {
    limit_req zone=fixedyet_post burst=3 nodelay;
    limit_req_status 429;

    # The only request body is {"issue_url": "..."}.
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Server-sent events: pass each event through as soon as it is written. The app sends a
    # keepalive comment every 15 seconds, so an idle stream never reaches the read timeout.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
}
