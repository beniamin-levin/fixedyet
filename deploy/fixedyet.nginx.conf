# FixedYet at https://fixedyet.benlevin.fyi/  ->  the FastAPI app on 127.0.0.1:8090
#
# This file is a location snippet for the fixedyet.benlevin.fyi server block. deploy.sh copies it
# to /etc/nginx/snippets/fixedyet-site.conf; the server block (fixedyet-server.nginx.conf, set up
# once by hand and given its certificate by certbot) includes it with one line:
#
#     include snippets/fixedyet-site.conf;
#
# The zone used below is declared in fixedyet-limits.nginx.conf (http level, installed as
# /etc/nginx/conf.d/fixedyet-limits.conf). The app runs at the root of the host, so nothing is
# stripped or added on the way.

location / {
    limit_req zone=fixedyet_post burst=3 nodelay;
    limit_req_status 429;

    # The only request body is {"issue_url": "..."}.
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    # The app builds its redirects from Host and X-Forwarded-Proto. uvicorn trusts the forwarded
    # headers only from the addresses in FORWARDED_ALLOW_IPS: 127.0.0.1 by default, and the nginx
    # VM's private IP on the Docker host (fixedyet-docker-host.conf).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Server-sent events: pass each event through as soon as it is written. The app sends a
    # keepalive comment every 15 seconds, so an idle stream never reaches the read timeout.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
}
