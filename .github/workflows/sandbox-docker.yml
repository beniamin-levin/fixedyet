name: sandbox-docker

# Integration tests for the Docker sandbox backend and the baseline builder.
# They build a real environment for pypa/sampleproject, so they need Docker and the network.
# Unit tests (no Docker, no network) run in ci.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Pre-pull the base image
        run: docker pull python:3.12
      - name: Docker integration tests
        run: pytest -m docker -v
